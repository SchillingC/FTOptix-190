Name: HMI190
Type: ProjectFolder
Children:
- Name: Localization
  Type: PropertyGroup
  Children:
  - Name: Locales
    Type: BaseDataVariableType
    DataType: LocaleId
    ValueRank: OneDimension
    ArrayDimensions: [0]
    Value: ["de-DE", "en-GB", "es-ES", "fr-FR", "ja-JP", "nl-NL", "pl-PL"]
  - Name: LocaleFallbackList
    Type: BaseDataVariableType
    DataType: LocaleId
    ValueRank: OneDimension
    ArrayDimensions: [0]
    Value: ["en-US"]
- Name: Authentication
  Type: PropertyGroup
  Children:
  - Name: DefaultUserFolder
    Type: NodePointer
    DataType: NodeId
    Value: "/Objects/HMI190/Security/Users"
    Children:
    - Name: Kind
      Type: PropertyType
      DataType: NodeId
      Value: "/Types/ObjectTypes/BaseObjectType/FolderType"
- Name: PasswordPolicy
  Type: PasswordPolicy
  Children:
  - Name: MaximumPasswordAge
    Type: BaseDataVariableType
    DataType: UInt16
  - Name: EnforcePasswordHistory
    Type: BaseDataVariableType
    DataType: Byte
    Value: 1
  - Name: MinimumPasswordAge
    Type: BaseDataVariableType
    DataType: UInt16
  - Name: MinimumPasswordLength
    Type: BaseDataVariableType
    DataType: Byte
    Value: 8
- Name: AlarmConfiguration
  Type: PropertyGroup
- File: Model/Model.yaml
- File: CommDrivers/CommDrivers.yaml
- File: Security/Security.yaml
